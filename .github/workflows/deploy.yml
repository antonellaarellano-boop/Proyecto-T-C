name: Deploy a Vercel

# Despliega a produccion en cada push a main.
#
# Version deliberadamente minima: un solo comando. Antes este workflow hacia
# `vercel pull` + `vercel build` + `vercel deploy --prebuilt`, tres pasos que
# fallaban sin dejar claro cual. Ahora se deja que Vercel compile del lado del
# servidor, que es exactamente lo que ocurre al desplegar a mano.
#
# Requiere tres secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       -> https://vercel.com/account/tokens
#                         IMPORTANTE: el scope debe incluir el team
#                         "antonellaarellano-6098s-projects", no solo la
#                         cuenta personal.
#   VERCEL_ORG_ID      -> team_S3RuRpE1OdN55fpsHe3o80fg
#   VERCEL_PROJECT_ID  -> prj_nC9FpiWoxYvjWnHr8Sd3O4SwEHh6
#
# Las variables de la app (Airtable, Supabase, KV, AUTH_SECRET) viven en el
# proyecto de Vercel y las toma el build remoto. Aca no va ninguna credencial
# de la aplicacion.

# Solo manual, a proposito. El disparo automatico en push quedo desactivado
# porque fallaba en cada intento y generaba correos de error. La via recomendada
# para el deploy automatico es la integracion nativa de Vercel con GitHub, que
# no necesita tokens ni secrets (ver seccion 8 de ARQUITECTURA_MODULOS.md).
#
# Para reactivar el disparo automatico, descomentar estas dos lineas:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy a produccion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falla temprano y con un mensaje legible si falta algun secret, en vez
      # de morir adentro de la CLI con un error de permisos.
      - name: Verificar secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          faltan=""
          if [ -z "$VERCEL_TOKEN" ];      then faltan="$faltan VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ];     then faltan="$faltan VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then faltan="$faltan VERCEL_PROJECT_ID"; fi
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets en el repositorio:$faltan"
            exit 1
          fi
          echo "VERCEL_TOKEN: ${#VERCEL_TOKEN} caracteres"
          echo "VERCEL_ORG_ID: ${#VERCEL_ORG_ID} caracteres (esperado 29)"
          echo "VERCEL_PROJECT_ID: ${#VERCEL_PROJECT_ID} caracteres (esperado 32)"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@62

      # Un unico comando. El proyecto se identifica por las dos variables de
      # entorno, asi que no hace falta `vercel link` ni `vercel pull`.
      # --cwd app porque el proyecto Next.js no esta en la raiz del repo.
      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --cwd app --token="${{ secrets.VERCEL_TOKEN }}"
